plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // ⚠️ يجب أن يكون Flutter Gradle Plugin بعد Android وKotlin
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.skills_swap"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // تحديث إلى Java 17 لأن Gradle 8 يتطلب ذلك كحد أدنى
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.skills_swap"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // استخدام مفاتيح debug مؤقتًا للتجربة
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
